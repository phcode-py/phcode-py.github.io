<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  {% if page.math %}
  <link rel="stylesheet" href="{{ '/assets/katex/katex.min.css' | relative_url }}">
  <script defer src="{{ '/assets/katex/katex.min.js' | relative_url }}"></script>
  <script defer src="{{ '/assets/katex/auto-render.min.js' | relative_url }}"></script>
  <script defer src="{{ '/assets/render-math.js' | relative_url }}"></script>
  {% endif %}
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="page">
    <header class="site-header">
      <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="Philipp Reinhardt, home">PR<span>.</span></a>
      <nav aria-label="Main navigation">
        <a href="{{ '/#about' | relative_url }}">About</a>
        <a href="{{ '/#blog' | relative_url }}">Blog</a>
      </nav>
    </header>
    <main id="main" tabindex="-1">{{ content }}</main>
    <footer class="site-footer"><span>Philipp Reinhardt</span><span class="footer-note">Personal website</span></footer>
  </div>
</body>
</html>
